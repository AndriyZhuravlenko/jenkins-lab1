version: '3.8'

networks:
  monitoring_network:
    driver: bridge

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: monitoring_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - monitoring_network

  grafana:
    image: grafana/grafana:latest
    container_name: monitoring_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - monitoring_network

  jenkins-new:
    image: jenkins/jenkins:lts
    container_name: jenkins_monitoring_target
    restart: unless-stopped
    ports:
      - "8085:8080"
      - "50005:50000"
    networks:
      - monitoring_network
