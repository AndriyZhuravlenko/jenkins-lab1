---
- name: Configure Application Node
  hosts: app_node
  gather_facts: no
  tasks:
    - name: Bootstrap python for Ansible
      raw: apt-get update && apt-get install -y python3 python3-pip curl

    - name: Gather facts after bootstrap
      setup:

    - name: Install Docker Engine components
      apt:
        name:
          - docker.io
          - docker-compose
        state: present
        update_cache: yes

    - name: Run Node Exporter container
      community.docker.docker_container:
        name: node-exporter
        image: prom/node-exporter:latest
        state: started
        restart_policy: always
        # Замість ports вказуємо мережу Terraform
        networks:
          - name: lab8_network

    - name: Run Web Application container (Nginx)
      community.docker.docker_container:
        name: web-app
        image: nginx:latest
        state: started
        restart_policy: always
        # Замість ports вказуємо мережу Terraform
        networks:
          - name: lab8_network

- name: Configure Monitoring Node
  hosts: monitor_node
  gather_facts: no
  vars:
    # Цю змінну ми передамо через Jenkins з outputs Terraform
    app_node_ip: "{{ hostvars['localhost']['terraform_app_ip'] }}"
  tasks:
    - name: Bootstrap python for Ansible
      raw: apt-get update && apt-get install -y python3 python3-pip curl

    - name: Gather facts after bootstrap
      setup:

    - name: Install Docker Engine components
      apt:
        name:
          - docker.io
          - docker-compose
        state: present
        update_cache: yes

    # Змінено на /opt/prometheus, щоб уникнути конфлікту монтування через docker.sock
    - name: Create Prometheus configuration directory
      file:
        path: /opt/prometheus
        state: directory
        mode: '0755'

    # Генеруємо конфігураційний файл у нову директорію
    - name: Generate Prometheus configuration from Jinja2 template
      template:
        src: templates/prometheus.yml.j2
        dest: /opt/prometheus/prometheus.yml
        mode: '0644'

    - name: Run Prometheus container
      community.docker.docker_container:
        name: prometheus
        image: prom/prometheus:latest
        state: started
        restart_policy: always
        # Важливо: монтуємо директорію цілком, щоб Docker-демон на хості коректно її підхопив
        volumes:
          - /opt/prometheus:/etc/prometheus
        # Замість ports вказуємо мережу Terraform
        networks:
          - name: lab8_network

    - name: Run Grafana container
      community.docker.docker_container:
        name: grafana
        image: grafana/grafana:latest
        state: started
        restart_policy: always
        # Замість ports вказуємо мережу Terraform
        networks:
          - name: lab8_network
