---
- name: Configure Application Node
  hosts: app_node
  gather_facts: no
  tasks:
    - name: Update apt cache and install Nginx + Node Exporter
      raw: apt-get update && apt-get install -y nginx prometheus-node-exporter curl

    - name: Ensure Nginx is running
      shell: service nginx start

    - name: Ensure Node Exporter is running
      shell: prometheus-node-exporter --web.listen-address=:9100 &
      async: 10
      poll: 0

- name: Configure Monitoring Node
  hosts: monitor_node
  gather_facts: no
  tasks:
    - name: Update apt cache and install Prometheus + Grafana
      raw: apt-get update && apt-get install -y prometheus grafana curl

    - name: Create Prometheus config for Lab 8
      copy:
        dest: /etc/prometheus/prometheus.yml
        content: |
          global:
            scrape_interval: 15s
          scrape_configs:
            - job_name: 'node_exporter'
              static_configs:
                - targets: ['lab8-app-node:9100']

    - name: Ensure Prometheus is running
      shell: service prometheus restart

    - name: Ensure Grafana is running
      shell: service grafana-server start
