k---
- name: Configure Application Node
  hosts: app_node
  gather_facts: no
  tasks:
    - name: Update apt cache and install Nginx + Node Exporter
      raw: apt-get update && apt-get install -y nginx prometheus-node-exporter curl

    - name: Ensure Nginx is running
      shell: service nginx start

    - name: Ensure Node Exporter is running via nohup
      shell: nohup prometheus-node-exporter --web.listen-address="0.0.0.0:9100" > /var/log/node-exporter.log 2>&1 &
      async: 10
      poll: 0

- name: Configure Monitoring Node
  hosts: monitor_node
  gather_facts: no
  tasks:
    - name: Install prerequisites for Grafana
      raw: apt-get update && apt-get install -y wget gnupg2 apt-transport-https software-properties-common curl

    - name: Add Grafana GPG key
      shell: |
        mkdir -p /etc/apt/keyrings
        wget -q -O - https://apt.grafana.com/gpg.key | gpg --dearmor --yes -o /etc/apt/keyrings/grafana.gpg

    - name: Add Grafana repository
      shell: |
        echo "deb [signed-by=/etc/apt/keyrings/grafana.gpg] https://apt.grafana.com stable main" > /etc/apt/sources.list.d/grafana.list
      ignore_errors: yes

    - name: Alternative Add Grafana repository (fallback)
      shell: echo "deb [signed-by=/etc/apt/keyrings/grafana.gpg] https://apt.grafana.com stable main" >> /etc/apt/sources.list

    - name: Update apt and install Prometheus + Grafana
      raw: apt-get update && apt-get install -y prometheus grafana

    - name: Create Prometheus configuration directory
      raw: mkdir -p /etc/prometheus

    - name: Generate Prometheus configuration
      copy:
        dest: /etc/prometheus/prometheus.yml
        content: |
          global:
            scrape_interval: 15s
          scrape_configs:
            - job_name: 'node_exporter'
              static_configs:
                - targets: ['lab8-app-node:9100']

    - name: Ensure Prometheus is running via nohup
      shell: nohup prometheus --config.file=/etc/prometheus/prometheus.yml --web.listen-address="0.0.0.0:9090" > /var/log/prometheus.log 2>&1 &
      async: 10
      poll: 0

    - name: Ensure Grafana is running via nohup
      shell: nohup grafana-server --config=/etc/grafana/grafana.ini --homepath=/usr/share/grafana web > /var/log/grafana.log 2>&1 &
      async: 10
      poll: 0

